<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misanino Kart – Live laps</title>
<style>
:root{--bg:#0b0d10;--panel:#14181d;--line:#232a32;--text:#e8eaed;--mute:#8b95a1;--purple:#c77dff;--green:#3ddc84;--amber:#ffb020;--red:#ff5a5f;--pin:#ffd60a;--blue:#5aa9ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:rgba(11,13,16,.96);border-bottom:1px solid var(--line);padding:8px 12px 6px}
.top{display:flex;align-items:center;gap:8px}
.titles{flex:1;min-width:0}
.t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-size:17px;font-weight:700}
.flag{width:14px;height:14px;border-radius:3px;background:#444;flex:none}
.flag.g{background:var(--green)}.flag.y{background:var(--amber)}.flag.r{background:var(--red)}
.flag.f{background:repeating-conic-gradient(#fff 0 25%,#000 0 50%) 0 0/7px 7px}
.status{font-size:11px;padding:4px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.status.open{color:var(--green);border-color:#1f5c3a}.status.demo{color:var(--amber);border-color:#6b4c12}
.bar{display:flex;gap:6px;margin-top:8px;align-items:center}
.seg{display:flex;flex:1;background:var(--panel);border-radius:8px;padding:2px}
.seg button{flex:1;padding:6px 0;border-radius:6px;font-size:12px;color:var(--mute)}
.seg button.on{background:#2a323c;color:var(--text);font-weight:600}
.sbest{font-size:11px;color:var(--mute);margin-top:6px}
.sbest b{color:var(--purple);font-weight:600}
ul{list-style:none;margin:0;padding:0}
.row{background:var(--bg);display:grid;grid-template-columns:26px 36px 1fr auto 30px;column-gap:8px;align-items:center;padding:8px 6px 4px 10px;border-bottom:1px solid var(--line);position:relative}
.row.pin{background:linear-gradient(90deg,rgba(255,214,10,.09),transparent 60%),var(--bg)}
.row.flash{animation:fl 1.2s ease-out}
@keyframes fl{from{background-color:#2b3037}to{background-color:var(--bg)}}
.pos{font-weight:700;font-size:16px;text-align:center}
.no{background:#e8eaed;color:#000;font-weight:700;border-radius:5px;text-align:center;padding:3px 0;font-size:14px}
.who{min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pit{color:#000;background:var(--amber);border-radius:3px;padding:0 4px;font-weight:700;font-size:10px}
.times{text-align:right}
.last{font-size:18px;font-weight:700}
.sb{color:var(--purple)}.pb{color:var(--green)}.slow{color:var(--amber)}
.sub{font-size:11.5px;color:var(--mute)}
.star{font-size:20px;color:#3a434e;height:36px}.pin .star{color:var(--pin)}
.form{grid-column:2/5;display:flex;align-items:flex-end;gap:2px;height:16px;margin-top:4px}
.form i{flex:1;max-width:14px;background:#56616d;border-radius:1px;min-height:2px}
.form i.sb{background:var(--purple)}.form i.pb{background:var(--green)}.form i.slow{background:var(--amber)}
.prog{grid-column:1/-1;height:2px;margin-top:4px}
.prog i{display:block;height:100%;background:#3d6ea8;width:0}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
.btn{display:inline-block;padding:9px 14px;border-radius:8px;background:#2a323c;margin:6px 4px;font-weight:600}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;display:none;padding-bottom:30px}
.sheet.on{display:block}
.shead{position:sticky;top:0;z-index:2;background:rgba(11,13,16,.97);display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.back{font-size:22px;padding:0 6px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px}
.tile{background:var(--panel);border-radius:8px;padding:8px 4px;text-align:center}
.tile small{display:block;color:var(--mute);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
.tile b{font-size:15px}
.chart{padding:0 12px}.chart svg{width:100%;height:auto;background:var(--panel);border-radius:8px;display:block}
.note{color:var(--mute);font-size:11.5px;padding:6px 12px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:14px 12px 2px;font-weight:600}
table{width:100%;border-collapse:collapse;margin-top:4px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);font-size:13.5px}
th{color:var(--mute);font-weight:500;font-size:11px;text-transform:uppercase}
th:first-child,td:first-child{text-align:left}
.laps td:first-child{color:var(--mute)}
.drv tr.on td{background:#1d2733}.drv tr.on td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
.drv th,.drv td{padding:6px 5px;font-size:12.5px}.drv td:first-child{font-family:system-ui,sans-serif;max-width:30vw;padding-left:10px}
.drv .dn{font-weight:600;display:block;line-height:1.2}
.drv small{color:var(--mute);font-size:11px}
.drv input{width:100%;padding:5px;border-radius:6px;border:1px solid var(--blue);background:var(--panel);color:var(--text);font:inherit}
.ren{color:var(--mute);padding:0 4px;font-size:13px}
tr.sh td{background:var(--panel);color:var(--text);font-size:12px;text-align:left;font-family:system-ui,sans-serif}
tr.sh b{color:var(--blue)}
.set{padding:12px}.set label{display:block;color:var(--mute);font-size:12px;margin-top:10px}
.set input{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
pre{background:var(--panel);border-radius:8px;padding:8px;font-size:10.5px;max-height:40vh;overflow:auto;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<header>
  <div class="top">
    <span class="flag" id="flag"></span>
    <div class="titles"><div class="t1" id="t1">Misanino Kart</div><div class="t2" id="t2"></div></div>
    <span class="clock num" id="clock"></span>
    <button class="status" id="status">…</button>
  </div>
  <div class="bar">
    <div class="seg" id="sort">
      <button data-s="pos" class="on">Position</button><button data-s="best">Best lap</button><button data-s="last">Last lap</button><button data-s="pace">Pace (5)</button>
    </div>
  </div>
  <div class="sbest" id="sbest"></div>
</header>
<ul id="list"></ul>
<div class="empty" id="empty">Waiting for timing data…<br><br>
  <button class="btn" id="demoBtn">Try demo data</button><button class="btn" id="setBtn">Connection</button></div>

<div class="sheet" id="detail"></div>
<div class="sheet" id="settings">
  <div class="shead"><button class="back" data-close>‹</button><b>Connection</b></div>
  <div class="set">
    <label>My team (part of the name) – starred automatically</label><input id="team">
    <label>Host</label><input id="host">
    <label>Port (configPort from the track's config.js)</label><input id="port" inputmode="numeric">
    <div style="margin-top:12px"><button class="btn" id="connBtn">Save &amp; connect</button><button class="btn" id="demoBtn2">Demo</button><button class="btn" id="clearBtn">Clear saved laps</button></div>
    <label>Raw feed (for debugging) <button class="btn" id="copyBtn" style="padding:3px 8px;margin:0 0 0 6px">Copy</button></label>
    <textarea id="export" readonly style="display:none;width:100%;height:30vh;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:11px;margin-bottom:8px"></textarea>
    <pre id="raw"></pre>
  </div>
</div>

<script>
'use strict';
/* ---------- util ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseTime(s){ // "1:02.345" | "52.345" -> seconds, else null
  if(!s) return null; const m = String(s).trim().match(/^(?:(\d+):)?(?:(\d+):)?(\d+(?:[.,]\d+)?)$/); if(!m) return null;
  const sec = parseFloat(m[3].replace(',','.')); if(isNaN(sec)) return null;
  if(m[2]!==undefined) return (+m[1])*3600 + (+m[2])*60 + sec;
  return (m[1]!==undefined ? (+m[1])*60 : 0) + sec;
}
function fmt(t){ if(t==null) return '–'; const m = Math.floor(t/60), s = t - m*60; return m ? m+':'+(s<10?'0':'')+s.toFixed(3) : s.toFixed(3); }
function fmtD(d){ return d==null ? '' : (d>=0?'+':'−')+Math.abs(d).toFixed(3); }
function fmtMs(ms){ let s=Math.round(ms/1000); const h=Math.floor(s/3600); s-=h*3600; const m=Math.floor(s/60); return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s-m*60).padStart(2,'0'); }
function median(a){ if(!a.length) return null; const b=[...a].sort((x,y)=>x-y), n=b.length>>1; return b.length%2 ? b[n] : (b[n-1]+b[n])/2; }
function lapStats(ts){ // clean = within 7% of the median (drops pit/traffic laps)
  const med=median(ts), clean=med==null?[]:ts.filter(t=>t<=med*1.07), avg=clean.length?clean.reduce((a,b)=>a+b,0)/clean.length:null;
  const sd=clean.length>=3?Math.sqrt(clean.reduce((a,b)=>a+(b-avg)**2,0)/clean.length):null;
  return {med,avg,sd,best:ts.length?Math.min(...ts):null,clean};
}

/* ---------- ApexFeed: socket + line protocol. API: connect(host,port), ingest(text), close() ---------- */
function createFeed({onBatch, onStatus, onRaw}){
  let ws=null, urls=[], idx=0, retry=0, timer=null, stopped=true;
  function parse(text){
    const out=[]; for(const line of text.split('\n')){ if(!line) continue; onRaw(line);
      const i=line.indexOf('|'); if(i<0) continue; const j=line.indexOf('|',i+1);
      out.push(j<0 ? {id:line.slice(0,i),cmd:line.slice(i+1)} : {id:line.slice(0,i),cmd:line.slice(i+1,j),val:line.slice(j+1)}); }
    return out;
  }
  function open(){
    if(stopped) return; const url=urls[idx%urls.length]; onStatus('connecting',url); let got=false, me;
    try{ me=ws=new WebSocket(url); }catch(e){ idx++; return again(); }
    me.onopen=()=>{ if(me===ws) onStatus('open',url); };
    me.onmessage=e=>{ if(me!==ws||typeof e.data!=='string') return; got=true; retry=0; onBatch(parse(e.data)); };
    me.onclose=()=>{ if(me!==ws||stopped) return; if(!got) idx++; again(); };
  }
  function again(){ onStatus('retry'); clearTimeout(timer); timer=setTimeout(open, Math.min(1000*2**retry++,15000)); }
  function close(){ stopped=true; clearTimeout(timer); if(ws){ const w=ws; ws=null; try{w.close()}catch(e){} } }
  return {
    connect(host,port){ close(); stopped=false; idx=0; retry=0;
      urls=[`wss://${host}:${port+3}/`]; if(location.protocol!=='https:') urls.push(`ws://${host}:${port+2}/`); open(); },
    ingest(text){ onBatch(parse(text)); },
    close
  };
}

/* ---------- ApexHistory: whole-race laps + pit stops for one team. API: fetch(rowId) -> {laps,pits,names,other} ---------- */
function createHistory(cfg){
  function parse(text,teamId){
    const laps=[], pits=[], other=[];
    for(const line of text.split('\n')){ const m=/^D\d+\.([A-Za-z]+)(\d*)#(.*)$/.exec(line.trim()); if(!m){ if(line.trim()) other.push(line.trim()); continue; }
      const f=m[3].split('|');
      if(m[1]==='L'){ const ms=parseInt(f[3],10); if(ms>0) laps.push({n:parseInt(m[2],10),t:ms/1000,s:f.slice(0,3).map(x=>x?parseInt(x,10)/1000:null)}); }
      else if(m[1]==='P'){ pits.push({no:+f[0],lap:+f[1],inMs:+f[2],outMs:+f[3],pitMs:+f[4],stintMs:+f[5],laps:+f[6],driverId:f[7]||'0',totalMs:+f[8]||0}); }
      else other.push(line.trim()); }
    laps.sort((a,b)=>a.n-b.n); pits.sort((a,b)=>a.no-b.no);
    // driver names live in the INF line: <driver id=team ...><driver id=.. name=".."/>...
    const names={}; let current=null, team=''; const dec=x=>{ const d=document.createElement('textarea'); d.innerHTML=x; return d.value.trim(); };
    for(const l of other){ if(!/\.INF#/.test(l)) continue; let m; const re=/<driver\s+([^>]*?)\/?>/g;
      while((m=re.exec(l))){ const id=/\bid="(\d+)"/.exec(m[1]), nm=/\bname="([^"]*)"/.exec(m[1]); if(!id||!nm||!nm[1]) continue; if(id[1]===teamId){ team=dec(nm[1]); continue; }
        names['d'+id[1]]=dec(nm[1]).toLowerCase().replace(/(^|[\s'-])(\S)/g,(x,a,b)=>a+b.toUpperCase()); if(/\b(current|active|selected|driving|ontrack|on)="(1|true|yes)"/i.test(m[1])) current=id[1]; } }
    return {laps,pits,names,other,current,team};

  }
  async function post(request){ const res=await fetch('https://'+cfg.host+'/live-timing/commonv2/functions/request.php',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'port='+cfg.port+'&request='+encodeURIComponent(request)}); return res.status+' '+(await res.text()); }
  return { post, async fetch(rowId){
    const res=await fetch('https://'+cfg.host+'/live-timing/commonv2/functions/request.php',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'port='+cfg.port+'&request='+encodeURIComponent('D#-999#D'+rowId.slice(1))});
    if(!res.ok) throw new Error('HTTP '+res.status); return parse(await res.text(),rowId.slice(1)); } };
}

/* ---------- RaceStore: protocol messages -> race state. API: apply, rows, row, setHistory, togglePin, clear, meta ---------- */
function createStore({storageKey, onChange}){
  const TYPE_BY_TEXT=[[/^s(ect\w*)?\.? ?1/i,'s1'],[/^s(ect\w*)?\.? ?2/i,'s2'],[/^s(ect\w*)?\.? ?3/i,'s3'],[/mig|best|meill/i,'blp'],[/ult|last|dern|^giro$|^lap$|^tour$/i,'llp'],[/gap|dist|cart/i,'gap'],[/^int/i,'int'],[/giri|laps|tours/i,'tlp'],[/pilot|driver|team|nom|name|squadr/i,'dr'],[/kart|n°|^no|num/i,'no'],[/pos|cla|^rk/i,'rk'],[/pit|box/i,'pit']];
  const meta={t1:'',t2:'',flag:'',clock:null,sessionBest:null};
  let cols={}, typeCol={}, rows=new Map(), hist={}, pins=new Set(), sessionKey='', pending=[];
  try{ pins=new Set(JSON.parse(localStorage.getItem(storageKey+':pins')||'[]')); }catch(e){}
  const strip = h => { if(h.indexOf('<')<0&&h.indexOf('&')<0) return h.trim(); const d=document.createElement('div'); d.innerHTML=h; return d.textContent.trim(); };
  const cell = (r,type) => r.cells[typeCol[type]] || null;
  const cv = (r,type) => { const c=cell(r,type); return c ? c.v : ''; };

  function loadHist(){ hist={}; try{ const s=JSON.parse(localStorage.getItem(storageKey+':laps')||'null'); if(s&&s.k===sessionKey) hist=s.h; }catch(e){} }
  function save(){ try{ localStorage.setItem(storageKey+':laps', JSON.stringify({k:sessionKey,h:hist})); localStorage.setItem(storageKey+':pins', JSON.stringify([...pins])); }catch(e){} }
  setInterval(save, 8000);

  function setGrid(html){
    const doc=new DOMParser().parseFromString('<table>'+html+'</table>','text/html'), old=rows;
    cols={}; typeCol={}; rows=new Map();
    for(const tr of doc.querySelectorAll('tr')){
      const rid=tr.getAttribute('data-id')||''; const tds=[...tr.children];
      if(tr.classList.contains('head') || rid==='r0'){
        tds.forEach((td,i)=>{ const id=td.getAttribute('data-id')||('c'+(i+1)); let type=td.getAttribute('data-type')||'';
          const label=td.textContent.trim(); if(!type) for(const [re,t] of TYPE_BY_TEXT) if(re.test(label)){ type=t; break; }
          cols[id]={type,label}; if(type && !(type in typeCol)) typeCol[type]=id; });
        continue;
      }
      if(!/^r\d+$/.test(rid)) continue;
      const o=old.get(rid);
      const r={id:rid,cells:{},laps:[],pits:o?o.pits:[],names:o?o.names:{},team:o?o.team:'',seen:o?o.seen:new Map(),cur:o?o.cur:null,lastCross:o?o.lastCross:0,inPit:false,flashAt:0,pos:parseInt(tr.getAttribute('data-pos'),10)||999};
      tds.forEach((td,i)=>{ const el = td.hasAttribute('data-id') ? td : td.querySelector('[data-id]');
        const m = el && /^r\d+(c\d+)$/.exec(el.getAttribute('data-id')); const cid = m ? m[1] : 'c'+(i+1);
        r.cells[cid]={v:(el||td).textContent.trim(), c:(el||td).className||td.className||''}; });
      r.inPit=((cell(r,'otr')||{}).c==='to'); { const v=cv(r,'dr'); if(v) r.seen.set(v,(r.seen.get(v)||0)+1); }
      rows.set(rid,r);
    }
    const k=meta.t1+'|'+meta.t2; if(k!==sessionKey){ sessionKey=k; loadHist(); meta.sessionBest=null; }
    for(const r of rows.values()){ r.key=keyOf(r); r.laps=hist[r.key]||(hist[r.key]=[]); }
    recomputeBest();
  }
  function keyOf(r){ return cv(r,'no') || r.id; }
  // the name cell alternates between team and current driver: the team is what the server says, else the value seen most (first seen on ties)
  function teamName(r){ if(r.team) return r.team; let best='',n=0; for(const [v,c] of r.seen) if(c>n){ best=v; n=c; } return best; }
  function onTrack(r){ const v=cv(r,'dr'), t=teamName(r); return v && v!==t ? v : (r.onTrack||''); }
  function recomputeBest(){ let b=null; for(const r of rows.values()){ const p=ownBest(r); if(p!=null&&(b==null||p<b)) b=p; } meta.sessionBest=b; }
  function ownBest(r){ let b=parseTime(cv(r,'blp')); for(const l of r.laps) if(b==null||l.t<b) b=l.t; return b; }

  function onCell(r,cid,cls,val){
    const c=r.cells[cid]||(r.cells[cid]={v:'',c:''}); if(cls) c.c=cls; if(val!==undefined) c.v=strip(val);
    const type=(cols[cid]||{}).type;
    if(type==='llp' && val){ const t=parseTime(c.v); if(t!=null && t>0){ const now=Date.now(), prev=r.laps[r.laps.length-1];
      if(!(prev && prev.t===t && prev.at && now-prev.at < t*600)) pending.push({r,t,cls:c.c,at:now}); } }
    if(type==='otr') r.inPit = c.c==='to';
    if(type==='dr' && c.v) r.seen.set(c.v,(r.seen.get(c.v)||0)+1);
  }
  function flushLaps(){
    for(const p of pending){ const r=p.r, blp=parseTime(cv(r,'blp')); let prevBest=null; for(const l of r.laps) if(prevBest==null||l.t<prevBest) prevBest=l.t;
      const n=parseInt(cv(r,'tlp'),10), last=r.laps[r.laps.length-1]; const lap={n:isNaN(n)?(last?last.n+1:1):n, t:p.t, at:p.at};
      r.lastCross=p.at; r.flashAt=p.at;
      if(last && lap.n<=last.n) continue; // already known (e.g. from the race history)
      if('s1' in typeCol){ const s=['s1','s2','s3'].map(k=>parseTime(cv(r,k))); if(s.some(x=>x!=null)) lap.s=s; }
      lap.pb = (prevBest==null||p.t<=prevBest) && (blp==null||p.t<=blp+0.0005);
      lap.sb = lap.pb && (/^tb/.test(p.cls) || meta.sessionBest==null || p.t<=meta.sessionBest+0.0005);
      r.laps.push(lap);
      if(meta.sessionBest==null||p.t<meta.sessionBest) meta.sessionBest=p.t; }
    pending=[];
  }
  function apply(batch){
    for(const {id,cmd,val} of batch){
      let m;
      if(id==='grid') setGrid(val||'');
      else if(id==='title1') meta.t1=strip(val||''); else if(id==='title2') meta.t2=strip(val||'');
      else if(id==='light') meta.flag=(cmd||'').replace(/^l/,'').charAt(0);
      else if(id==='dyn1'){ const ms=parseInt(val,10);
        meta.clock = cmd==='countdown'&&!isNaN(ms) ? {end:Date.now()+ms} : cmd==='count'&&!isNaN(ms) ? {start:Date.now()-ms} : {text:strip(val||'')}; }
      else if((m=/^(r\d+)(c\d+)$/.exec(id))){ const r=rows.get(m[1]); if(r) onCell(r,m[2],cmd,val); }
      else if(/^r\d+$/.test(id)){ const r=rows.get(id); if(!r) continue;
        if(cmd==='#'){ const p=parseInt(val,10); if(p>0) r.pos=p; } }
    }
    flushLaps(); onChange();
  }
  function setHistory(id,h){ // replace a team's laps with the server's full-race list, keep newer live laps
    const r=rows.get(id); if(!r) return; if(h.team) r.team=h.team; Object.assign(r.names,h.names); if(!h.laps.length){ onChange(); return; }
    const maxN=h.laps[h.laps.length-1].n, live=r.laps.filter(l=>l.n>maxN), all=[...h.laps,...live]; let best=null;
    for(const l of all){ l.pb = best==null||l.t<best; if(l.pb) best=l.t; l.sb = l.pb && meta.sessionBest!=null && l.t<=meta.sessionBest+0.0005; }

    if(meta.sessionBest==null||best<meta.sessionBest) meta.sessionBest=best;

  }
  function view(r){ const ot=onTrack(r); if(ot) r.onTrack=ot; let cur=r.cur;
    if(!cur&&ot){ const k=Object.keys(r.names).find(k=>r.names[k].toLowerCase()===ot.toLowerCase()); if(k) cur=k.slice(1); }

}

/* ---------- Stints: split a team's laps into stints and drivers. API: breakdown(row) ---------- */
function breakdown(r){
  const stints=[]; let from=1;
  r.pits.forEach((p,i)=>{ stints.push({i:i+1,from,to:p.lap,drv:'d'+p.driverId,pit:p,laps:[]}); from=p.lap+1; });
  stints.push({i:r.pits.length+1,from,to:Infinity,drv:r.cur?'d'+r.cur:'cur',pit:null,laps:[]});
  // the lap that contains a stop: found by its time (far slower than normal) next to the recorded pit lap, not assumed
  const med=median(r.laps.map(l=>l.t)), pitLaps=new Map(); // lap number -> the stop it contains
  if(med) for(const p of r.pits) for(const l of r.laps) if(l.n>=p.lap&&l.n<=p.lap+2&&l.t>med*1.25&&!pitLaps.has(l.n)) pitLaps.set(l.n,p);
  const drivers=new Map(); let num=0;
  for(const s of stints){ if(!drivers.has(s.drv)) drivers.set(s.drv,{id:s.drv,stints:[],laps:[],label:s.drv==='cur'?(r.onTrack||'On track now'):s.drv==='d0'?'Starter':'Driver '+(++num)}); drivers.get(s.drv).stints.push(s); }
  for(const l of r.laps){ const s=stints.find(s=>l.n>=s.from&&l.n<=s.to)||stints[stints.length-1]; s.laps.push(l); drivers.get(s.drv).laps.push(l); }
  // best = fastest lap of all; average/spread leave out pit laps and the standing-start lap
  const st=laps=>({n:laps.length,...lapStats(laps.filter(l=>!pitLaps.has(l.n)&&l.n>1).map(l=>l.t)),best:laps.length?Math.min(...laps.map(l=>l.t)):null});
  for(const d of drivers.values()) d.st=st(d.laps); for(const s of stints) s.st=st(s.laps);
  return {stints,drivers:[...drivers.values()],pitLaps};
}

/* ---------- Demo: emits the same wire format so the whole pipeline is exercised ---------- */
function startDemo(feed){
  const names=['ROSSI M.','BIANCHI L.','FERRARI A.','CONTI G.','RICCI D.','MARINO S.','GALLO P.','GRECO F.'];
  const head='<tr data-id="r0" class="head"><td data-id="c1" data-type="sta"></td><td data-id="c2" data-type="rk">Pos</td><td data-id="c3" data-type="no">Kart</td><td data-id="c4" data-type="dr">Pilota</td><td data-id="c5" data-type="llp">Ultimo</td><td data-id="c6" data-type="blp">Migliore</td><td data-id="c7" data-type="gap">Gap</td><td data-id="c8" data-type="tlp">Giri</td></tr>';
  const k=names.map((n,i)=>({id:'r'+(i+1),no:String(3+i*7),name:n,base:8+i*0.12,laps:0,total:0,best:null,next:Date.now()+2000+i*900}));
  feed.ingest('init|r|\ntitle1||DEMO – Misanino\ntitle2||Gara simulata\nlight|lg|\ndyn1|countdown|900000\ngrid||<tbody>'+head+
    k.map((d,i)=>`<tr data-id="${d.id}" data-pos="${i+1}"><td data-id="${d.id}c1" class="sr"></td><td data-id="${d.id}c2" class="rk">${i+1}</td><td class="no"><div data-id="${d.id}c3" class="no1">${d.no}</div></td><td data-id="${d.id}c4" class="dr">${d.name}</td><td data-id="${d.id}c5" class="tn"></td><td data-id="${d.id}c6" class="tn"></td><td data-id="${d.id}c7" class="in"></td><td data-id="${d.id}c8" class="in">0</td></tr>`).join('')+'</tbody>');
  let sbest=null;
  return setInterval(()=>{ const now=Date.now(), out=[];
    for(const d of k) if(now>=d.next){ const t=+(d.base+Math.random()*0.5+(Math.random()<0.08?2.5:0)).toFixed(3);
      d.laps++; d.total+=t; d.next=now+t*1000; let cls='tn';
      if(d.best==null||t<d.best){ d.best=t; cls='ti'; out.push(`${d.id}c6|${sbest==null||t<sbest?'tb':'ti'}|${t.toFixed(3)}`); }
      if(sbest==null||t<sbest){ sbest=t; cls='tb'; }
      out.push(`${d.id}c8|in|${d.laps}`,`${d.id}c5|${cls}|${t.toFixed(3)}`); }
    if(out.length){ const s=[...k].sort((a,b)=>b.laps-a.laps||a.total-b.total);
      s.forEach((d,i)=>{ out.push(`${d.id}|#|${i+1}`,`${d.id}c2|rk|${i+1}`,`${d.id}c7|in|${i?(d.laps<s[0].laps?(s[0].laps-d.laps)+' Giri':(d.total-s[0].total).toFixed(3)):''}`); });
      feed.ingest(out.join('\n')); }
  },200);
}

  function render(){
    const now=Date.now(), m=store.meta, rows=sorted();
    $('t1').textContent=m.t1||'Misanino Kart'; $('t2').textContent=m.t2; $('flag').className='flag '+m.flag;
    const c=m.clock; $('clock').textContent = !c ? '' : c.text!=null ? c.text : fmtMs(Math.max(0,c.end?c.end-now:now-c.start));
    $('sbest').innerHTML = m.sessionBest!=null ? `Session best <b class="num">${fmt(m.sessionBest)}</b> · <span style="color:var(--green)">green</span> = personal best · <span style="color:var(--amber)">amber</span> = slow lap` : '';
    $('empty').style.display = rows.length?'none':'';
    if(!openId) renderList(rows,now);
    renderDetail(false);
    if($('settings').classList.contains('on')) $('raw').textContent=raw.slice(-80).map(l=>l.slice(0,400)).join('\n');
  }
  let lastFull=0;
  setInterval(()=>{ const now=Date.now(); if(dirty||now-lastFull>1000){ dirty=false; lastFull=now; render(); } }, 250);

  function saveName(input){ const r=store.row(openId); if(r){ const v=input.value.trim(), k=r.key+':'+input.getAttribute('data-name'); if(v) custom[k]=v; else delete custom[k];
      try{ localStorage.setItem('apexlive:names',JSON.stringify(custom)); }catch(e){} } editId=null; renderDetail(true); }
  document.addEventListener('change',e=>{ if(e.target.matches('input[data-name]')) saveName(e.target); });
  document.addEventListener('focusout',e=>{ if(e.target.matches&&e.target.matches('input[data-name]')&&editId) saveName(e.target); });
  document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.matches('input[data-name]')) e.target.blur(); });
  document.addEventListener('click',e=>{
    const t=e.target; if(t.matches('input[data-name]')) return;
    const pin=t.closest('[data-pin]'); if(pin){ store.togglePin(pin.getAttribute('data-pin')); render(); return; }
    if(t.closest('[data-close]')){ closeSheets(); render(); return; }
    const ren=t.closest('[data-ren]'); if(ren){ editId=ren.getAttribute('data-ren'); renderDetail(true); return; }
    const drv=t.closest('[data-drv]'); if(drv){ filterDrv=drv.getAttribute('data-drv')||null; renderDetail(true); return; }
    const s=t.closest('#sort button'); if(s){ sort=s.dataset.s; document.querySelectorAll('#sort button').forEach(b=>b.classList.toggle('on',b===s)); render(); return; }
    const row=t.closest('.row'); if(row){ openId=row.dataset.id; filterDrv=null; detailSig=''; const d=$('detail'); d.classList.add('on'); d.scrollTop=0; loadHistory(openId); render(); return; }
  });
  $('status').onclick=$('setBtn').onclick=()=>{ $('host').value=cfg.host; $('port').value=cfg.port; $('team').value=cfg.team; $('settings').classList.add('on'); render(); };
  $('demoBtn').onclick=$('demoBtn2').onclick=demo;
  $('connBtn').onclick=()=>{ cfg.host=$('host').value.trim()||cfg.host; cfg.port=parseInt($('port').value,10)||cfg.port; cfg.team=$('team').value.trim(); autoPinned=false;
    try{ localStorage.setItem('apexlive:cfg',JSON.stringify(cfg)); }catch(e){} closeSheets(); connect(); };
  $('clearBtn').onclick=()=>{ store.clear(); for(const k in hist) delete hist[k]; render(); };
  $('copyBtn').onclick=()=>{
    const text=[...raw.filter(l=>/^(grid|HIST|title|init|dyn|light)/.test(l)),'---',...raw.filter(l=>!/^(grid|HIST)/.test(l)).slice(-120)].join('\n');
    const ta=$('export'); ta.style.display='block'; ta.value=text; ta.focus(); ta.select(); ta.setSelectionRange(0,text.length);
    let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    const done=()=>{ $('copyBtn').textContent='Copied'; };
    if(ok) done(); else if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done,()=>{ $('copyBtn').textContent='Select all below + copy'; });
    else $('copyBtn').textContent='Select all below + copy';
  };

  if(location.hash==='#demo') demo(); else connect();
})();
</script>
</body>
</html>
